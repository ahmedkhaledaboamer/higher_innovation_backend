# Optional: local MongoDB for development.
#   docker compose up -d
# Runs as a single-node replica set ("rs0") because MongoDB transactions require one.
# Connection string: mongodb://127.0.0.1:27017/academy_crm_dev?replicaSet=rs0
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db
    # Initialise the replica set on first start (a no-op afterwards).
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  mongodata:
